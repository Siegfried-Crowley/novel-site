<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公益书坊 · 免费小说在线阅读</title>
  <meta name="description" content="公益免费小说在线阅读站：一键上传、自动解析，优质小说随心读。">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><span class="logo">📖</span><span>公益<em class="accent">书坊</em></span></a>
      <nav class="nav">
        <a href="/" data-page="home">首页</a>
        <a href="/rank" data-page="rank">排行榜</a>
        <a href="/list" data-page="list">全部小说</a>
        <a href="/favorites" data-page="favorites">我的收藏</a>
      </nav>
      <div class="header-right">
        <div class="search-box">
          <input type="text" placeholder="搜书名 / 作者…">
          <span class="icon">🔍</span>
        </div>
        <button class="theme-toggle" title="切换主题">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 轮播推荐 -->
    <section class="carousel" id="carousel" style="margin-top:22px">
      <div class="carousel-track" id="carouselTrack"></div>
      <div class="carousel-dots" id="carouselDots"></div>
    </section>

    <!-- 分类导航 -->
    <section class="section">
      <div class="cat-nav" id="catNav"></div>
    </section>

    <!-- 热门搜索 -->
    <section class="section" id="hotSearchSection" style="display:none">
      <div class="section-head">
        <h2 class="section-title">热门搜索</h2>
      </div>
      <div class="hot-search" id="hotSearch"></div>
    </section>

    <!-- 最近在读 -->
    <section class="section" id="continueSection">
      <div class="section-head">
        <h2 class="section-title">最近在读</h2>
        <span style="color:var(--text-2);font-size:13px">进度保存在本浏览器，可随时续读</span>
      </div>
      <div class="continue-grid" id="continueGrid"></div>
    </section>

    <!-- 最新更新 -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">最新更新</h2>
        <a class="section-more" href="/list?sort=updated">更多 ›</a>
      </div>
      <div class="book-grid" id="latestGrid"></div>
    </section>

    <!-- 热门推荐 -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">热门推荐</h2>
        <a class="section-more" href="/list?sort=views">更多 ›</a>
      </div>
      <div class="book-grid" id="hotGrid"></div>
    </section>
  </main>

  <footer class="site-footer container">
    <p>公益免费阅读 · 本站内容仅供学习交流，版权归原作者所有</p>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
